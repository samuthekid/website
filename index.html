<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Samuel</title>
  <meta name="description" content="Hi, I'm Samuel. I don't have a personal website but I make software." />
  <link rel="icon" type="image/png" href="mutemi-app/logo.png" />
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 48px;
      padding: 48px 24px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #d2d2d7;
      color: #1d1d1f;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .intro {
      max-width: 540px;
      text-align: center;
    }

    .intro h1 {
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0;
    }

    .apps-label {
      margin: 0 0 4px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #6e6e73;
      text-align: center;
    }

    .app-card {
      display: inline-flex;
      align-items: center;
      gap: 18px;
      width: 420px;
      max-width: 100%;
      padding: 16px 24px 16px 16px;
      border: 1px solid #e3e3e6;
      border-radius: 20px;
      background: #ffffff;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .app-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.10);
    }

    .app-card img {
      width: 64px;
      height: 64px;
      border-radius: 15px;
      display: block;
    }

    .app-card__name {
      font-size: 1.25rem;
      font-weight: 600;
    }

    .app-card__tagline {
      font-size: 0.95rem;
      color: #6e6e73;
      white-space: nowrap;
    }
  </style>
</head>

<body>
  <section class="intro">
    <h1>
      👋 Hi, I'm Samuel.
      <br />
      I don't have a personal website
      <br />
      but I make software
    </h1>
  </section>

  <section style="display:flex; flex-direction:column; align-items:center; gap:16px;">
    <p class="apps-label" style="margin:0;">Apps</p>
    <a class="app-card" href="mutemi-app/">
      <img src="mutemi-app/logo.png" alt="MuteMi app icon" width="64" height="64" />
      <span>
        <span class="app-card__name">MuteMi</span><br />
        <span class="app-card__tagline">Mute every mic. One keystroke.</span>
      </span>
    </a>
    <a class="app-card" href="blocked-by-square/">
      <img src="blocked-by-square/logo.png" alt="BlockedBySquare app icon" width="64" height="64" />
      <span>
        <span class="app-card__name">BlockedBySquare</span><br />
        <span class="app-card__tagline">Lock your Mac. Don't touch.</span>
      </span>
    </a>
  </section>
</body>

</html>
